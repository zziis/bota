<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خيال | Khayal Call</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- شريط الرأس العلوي -->
        <header class="app-header">
            <div class="logo-box">
                <img src="/images/avatar.jpg" alt="خيال" class="brand-avatar">
                <div class="brand-info">
                    <h1>خَيَال</h1>
                    <span class="brand-tag">Khayal Live Call</span>
                </div>
            </div>
            <div class="status-badge" id="callStatusBadge">
                <span class="status-dot"></span>
                <span id="statusText">جاري التهيئة...</span>
            </div>
        </header>

        <!-- مساحة المكالمة والعرض المرئي -->
        <main class="call-stage">
            <!-- شاشة الطرف البعيد (المشترك الآخر) -->
            <div class="remote-stream-container" id="remoteContainer">
                <!-- يظهر هذا العنصر في المكالمات الصوتية أو عند إغلاق الكاميرا -->
                <div class="audio-avatar-card" id="remoteAvatarCard">
                    <div class="avatar-ring-pulse">
                        <img src="/images/avatar.jpg" alt="المتصل" class="remote-avatar-img">
                    </div>
                    <h3 id="remoteUserName">الطرف الآخر</h3>
                    <p id="remoteRoleTag" class="role-tag">مكالمة مشفرة وآمنة</p>
                    <div class="voice-wave" id="voiceWaveIndicator">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <!-- فيديو الطرف البعيد -->
                <video id="remoteVideo" autoplay playsinline class="remote-video hidden"></video>
            </div>

            <!-- نافذة الفيديو المحلي (صورتك) -->
            <div class="local-stream-container" id="localContainer">
                <video id="localVideo" autoplay playsinline muted class="local-video"></video>
                <div class="local-placeholder" id="localPlaceholder">
                    <span>كاميرتك متوقفة</span>
                </div>
            </div>

            <!-- عداد وقت المكالمة -->
            <div class="call-timer-container" id="callTimerContainer">
                <span class="recording-icon"></span>
                <span id="callTimer">00:00</span>
            </div>

            <!-- إشعار الانتظار -->
            <div class="waiting-card" id="waitingCard">
                <div class="loader-spinner"></div>
                <h2>في انتظار انضمام الطرف الآخر</h2>
                <p>تم إرسال إشعار للمشرف / المستخدم برابط المكالمة المباشرة.</p>
                <div class="room-share-box">
                    <input type="text" id="roomLinkInput" readonly value="">
                    <button id="copyLinkBtn" class="btn-secondary">نسخ الرابط</button>
                </div>
            </div>
        </main>

        <!-- لوحة التحكم في المكالمة -->
        <footer class="call-controls">
            <button id="toggleMicBtn" class="control-btn active" title="كتم/تشغيل الميكروفون">
                <svg class="icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
                </svg>
                <span class="btn-label">الميكروفون</span>
            </button>

            <button id="toggleCamBtn" class="control-btn" title="تشغيل/إيقاف الكاميرا">
                <svg class="icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                </svg>
                <span class="btn-label">الكاميرا</span>
            </button>

            <button id="flipCamBtn" class="control-btn" title="تبديل الكاميرا">
                <svg class="icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/>
                </svg>
                <span class="btn-label">قلب</span>
            </button>

            <button id="endCallBtn" class="control-btn btn-danger" title="إنهاء المكالمة">
                <svg class="icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
                <span class="btn-label">إنهاء</span>
            </button>
        </footer>
    </div>

    <!-- مشغل WebRTC والاتصال -->
    <script src="/js/app.js"></script>
</body>
</html>
