<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ألعاب خيال</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0a1c;color:#fff;font-family:system-ui,Tahoma;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:30px;font-weight:800;background:linear-gradient(90deg,#34f5dc,#b348f4);-webkit-background-clip:text;color:transparent}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#17122c;border:1px solid #3c2860;border-radius:22px;padding:18px;min-height:145px;box-shadow:0 12px 30px #0005}.ico{font-size:42px}.card h3{margin:8px 0}.card p{color:#aaa4bd;font-size:13px}.btn{border:0;border-radius:14px;padding:11px 15px;background:linear-gradient(90deg,#7c35db,#b43ae4);color:white;font-weight:700;width:100%}.soon{opacity:.6}.rocketWrap{display:none;margin-top:18px;background:#110d24;border:1px solid #4b2a72;border-radius:24px;overflow:hidden}.sky{height:360px;position:relative;background:radial-gradient(circle at 50% 100%,#32205c,#0c0a19 70%);overflow:hidden}.rocket{position:absolute;bottom:22px;left:50%;font-size:52px;transform:translateX(-50%);transition:bottom .08s linear}.boom{font-size:76px}.hud{padding:16px;display:flex;gap:10px;align-items:center;justify-content:space-between}.score{font-size:26px;font-weight:800}.note{font-size:12px;color:#9d96af;margin-top:12px}@media(max-width:420px){.grid{grid-template-columns:1fr}.sky{height:320px}}
</style></head><body><div class="head"><div class="logo">خيال 🎮</div><div>مركز الألعاب</div></div><div class="grid">
<div class="card"><div class="ico">🚀</div><h3>الصاروخ</h3><p>لعبة مهارة ترفيهية: أطلق الصاروخ وحاول الوصول لأعلى ارتفاع قبل الانفجار.</p><button class="btn" onclick="openRocket()">لعب الآن</button></div>
<div class="card soon"><div class="ico">🎮</div><h3>محاكي PSP</h3><p>قسم المحاكي وتجهيز مكتبة الألعاب.</p><button class="btn" disabled>قريباً</button></div>
<div class="card soon"><div class="ico">🕹️</div><h3>P2P</h3><p>ألعاب بين مستخدمين واتصال مباشر.</p><button class="btn" disabled>قريباً</button></div></div>
<div class="rocketWrap" id="rocketWrap"><div class="sky" id="sky"><div class="rocket" id="rocket">🚀</div></div><div class="hud"><div class="score" id="score">0 م</div><button class="btn" id="launch" style="width:auto">إطلاق</button></div></div><div class="note">اللعبة ترفيهية فقط ولا تحتوي على رهان أو أموال حقيقية.</div>
<script>let running=false,t=null,h=0;const r=document.getElementById('rocket'),sc=document.getElementById('score'),sky=document.getElementById('sky'),btn=document.getElementById('launch');function openRocket(){document.getElementById('rocketWrap').style.display='block';document.getElementById('rocketWrap').scrollIntoView({behavior:'smooth'})}btn.onclick=()=>{if(running)return;running=true;h=0;r.textContent='🚀';r.classList.remove('boom');btn.disabled=true;t=setInterval(()=>{h+=Math.floor(3+Math.random()*9);sc.textContent=h+' م';r.style.bottom=Math.min(280,22+h*.45)+'px';if(Math.random()<Math.min(.015+h/45000,.08)||h>650){clearInterval(t);r.textContent='💥';r.classList.add('boom');running=false;btn.disabled=false;btn.textContent='إعادة المحاولة';setTimeout(()=>r.style.bottom='22px',800)}},90)};</script></body></html>
